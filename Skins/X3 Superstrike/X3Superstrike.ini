[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Logitech G PRO X3 SUPERSTRIKE
Author=danomat
Information=Shows battery and active onboard profile. Click to toggle profile 1 / 2.
Version=1.0.0
License=MIT

[MeasureStatus]
Measure=Plugin
Plugin=WebParser
URL=file://#@#status.txt
RegExp="^([12])\|([0-9]+)"

[MeasureProfile]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatus]
StringIndex=1

[MeasureBattery]
Measure=Plugin
Plugin=WebParser
URL=[MeasureStatus]
StringIndex=2
MinValue=0
MaxValue=100

[MeasureX3Toggle]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/C ""#@#X3Helper.exe" toggle > "#@#status.tmp" && move /Y "#@#status.tmp" "#@#status.txt" >nul"
State=Hide
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureStatus "Update"][!Delay 100][!UpdateMeasure MeasureProfile][!UpdateMeasure MeasureBattery][!UpdateMeter *][!Redraw]

[MeasureX3Status]
Measure=Plugin
Plugin=RunCommand
Program=cmd.exe
Parameter=/C ""#@#X3Helper.exe" status > "#@#status.tmp" && move /Y "#@#status.tmp" "#@#status.txt" >nul"
State=Hide
OutputType=ANSI
FinishAction=[!CommandMeasure MeasureStatus "Update"][!Delay 100][!UpdateMeasure MeasureProfile][!UpdateMeasure MeasureBattery][!UpdateMeter *][!Redraw]

[MeasureFiveMinuteTimer]
Measure=Calc
Formula=1
UpdateDivider=300
OnUpdateAction=[!CommandMeasure MeasureX3Status "Run"]

[MeterTitle]
Meter=String
X=0
Y=0
Text=X3 SUPERSTRIKE
FontFace=Verdana
FontSize=10
FontColor=0,255,0,255
StringStyle=Bold
AntiAlias=1

[MeterProfileLabel]
Meter=String
X=0
Y=22
Text=Profile:
FontFace=Tahoma
FontSize=8
FontColor=255,255,255,255
AntiAlias=1

[MeterProfile]
Meter=String
MeasureName=MeasureProfile
X=42
Y=22
Text=%1
FontFace=Tahoma
FontSize=8
FontColor=255,255,255,255
StringStyle=Bold
AntiAlias=1

[MeterBatteryLabel]
Meter=String
X=90
Y=22
Text=Battery:
FontFace=Tahoma
FontSize=8
FontColor=255,255,255,255
AntiAlias=1

[MeterBattery]
Meter=String
MeasureName=MeasureBattery
X=132
Y=22
Text=%1%
FontFace=Tahoma
FontSize=8
FontColor=0,255,0,255
StringStyle=Bold
AntiAlias=1

[MeterBatteryBarBackground]
Meter=Shape
X=0
Y=43
Shape=Rectangle 0,0,170,4 | Fill Color 60,60,60,255 | StrokeWidth 0

[MeterBatteryBar]
Meter=Bar
MeasureName=MeasureBattery
X=0
Y=43
W=170
H=4
BarOrientation=Horizontal
BarColor=0,192,0,255
SolidColor=0,0,0,1

[MeterClickArea]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,170,47 | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureX3Toggle "Run"]
ToolTipText=Click to switch onboard Profile 1 / 2
